server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/auth/ {
        proxy_pass http://intra-authenticator:9091/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/files/ {
        proxy_pass http://intra-file-upload:9092/api/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Intranet-Role $http_x_intranet_role;
        proxy_set_header X-Intranet-Username $http_x_intranet_username;
    }

    location = /api/files {
        proxy_pass http://intra-file-upload:9092/api/files;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Intranet-Role $http_x_intranet_role;
        proxy_set_header X-Intranet-Username $http_x_intranet_username;
    }

    location /api/calories/ {
        proxy_pass http://intra-calorie-tracker:9093/api/calories/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Intranet-Role $http_x_intranet_role;
        proxy_set_header X-Intranet-Username $http_x_intranet_username;
    }

    location = /api/health {
        proxy_pass http://intra-authenticator:9091/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
