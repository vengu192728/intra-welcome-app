# Example: copy static files from the package `www/` folder to /var/www/intra-welcome
# and include this file from your main nginx server block.
#
#   root /var/www/intra-welcome;
#   include /etc/nginx/snippets/intra-welcome.conf;

index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location = /favicon.svg {
    expires 30d;
    add_header Cache-Control "public";
}

